<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noite do Terror</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; cursor:none; }
  #stage { position:fixed; inset:0; background:#000; }
  video {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: contain;   /* troque p/ "cover" se quiser preencher a tela toda */
    background:#000; opacity:0; transition: opacity .25s linear;
  }
  video.active { opacity:1; }
  #gate {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; text-align:center; cursor:pointer;
    background: radial-gradient(circle at 50% 40%, #1a0000 0%, #000 72%);
    font-family:"Georgia","Times New Roman",serif; color:#e8e8e8;
  }
  #gate h1 {
    font-size:clamp(34px,7vw,92px); letter-spacing:.08em; color:#c01616;
    text-shadow:0 0 18px rgba(170,0,0,.7),0 2px 4px #000;
  }
  #gate p { font-size:clamp(15px,2.2vw,22px); color:#bbb; letter-spacing:.04em; }
  #gate .btn {
    margin-top:4px; border:2px solid #c01616; color:#fff; background:rgba(120,0,0,.25);
    padding:14px 34px; border-radius:6px; font-size:clamp(16px,2.4vw,24px);
    text-transform:uppercase; letter-spacing:.12em;
  }
  #gate.hidden { opacity:0; pointer-events:none; transition:opacity .5s; }
  #loading { position:fixed; bottom:16px; left:16px; z-index:5;
    font-family:monospace; font-size:12px; color:#555; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v0" playsinline muted preload="auto"></video>
    <video id="v1" playsinline muted preload="auto"></video>
  </div>
  <div id="gate">
    <h1>NOITE DO TERROR</h1>
    <p>Clique para iniciar em tela cheia e com som</p>
    <div class="btn">▶ Iniciar</div>
  </div>
  <div id="loading"></div>

<script>
  /* Lista de vídeos, na ordem. Mesma pasta do index.html. */
  const PLAYLIST = [
    "chunk_00.mp4","chunk_01.mp4","chunk_02.mp4","chunk_03.mp4",
    "chunk_04.mp4","chunk_05.mp4","chunk_06.mp4","chunk_07.mp4",
    "chunk_08.mp4","chunk_09.mp4","chunk_10.mp4"
  ];

  const vids = [document.getElementById("v0"), document.getElementById("v1")];
  const gate = document.getElementById("gate");
  const load = document.getElementById("loading");
  let cur = 0, idx = 0, started = false;
  const next = i => (i + 1) % PLAYLIST.length;
  const prep = (el,p) => { el.src = PLAYLIST[p]; el.load(); };

  function begin(){
    prep(vids[cur], idx);
    prep(vids[1-cur], next(idx));
    vids[cur].classList.add("active");
    vids[cur].play().catch(()=>{});
    bind();
  }
  function bind(){ vids.forEach(v=>v.onended=null); vids[cur].onended = swap; }
  function swap(){
    const o = 1-cur, np = next(idx);
    vids[o].currentTime = 0;
    vids[o].classList.add("active");
    vids[o].play().catch(()=>{});
    vids[cur].classList.remove("active");
    vids[cur].pause();
    cur = o; idx = np;
    prep(vids[1-cur], next(idx));
    bind();
  }
  function unlock(){
    if (started) return; started = true;
    gate.classList.add("hidden");
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    vids.forEach(v=>{ v.muted=false; v.volume=1; });
    vids[cur].play().catch(()=>{});
  }
  gate.addEventListener("click", unlock);
  window.addEventListener("load", ()=>{ vids.forEach(v=>v.muted=true); begin(); });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) vids[cur].play().catch(()=>{}); });

  // debug discreto de carregamento
  vids.forEach((v,i)=>{ v.addEventListener("error",()=>{ load.textContent="erro ao carregar "+v.currentSrc; }); });
</script>
</body>
</html>
