<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noite do Terror (mudo)</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; cursor:none; }
  #stage { position:fixed; inset:0; background:#000; }
  video {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: contain;   /* troque p/ "cover" se quiser preencher a tela toda */
    background:#000; opacity:0; transition: opacity .25s linear;
  }
  video.active { opacity:1; }
  #hint {
    position:fixed; bottom:18px; right:20px; z-index:5;
    font-family:"Georgia",serif; font-size:13px; color:#5a1010; letter-spacing:.05em;
    opacity:.6; transition:opacity .5s;
  }
  #hint.gone { opacity:0; }
</style>
</head>
<body>
  <div id="stage">
    <video id="v0" playsinline muted preload="auto" autoplay></video>
    <video id="v1" playsinline muted preload="auto"></video>
  </div>
  <div id="hint">clique para tela cheia</div>

<script>
  /* Vídeos na pasta de cima (compartilhados com a versão com som) */
  const PLAYLIST = [
    "../chunk_00.mp4","../chunk_01.mp4","../chunk_02.mp4","../chunk_03.mp4",
    "../chunk_04.mp4","../chunk_05.mp4","../chunk_06.mp4","../chunk_07.mp4",
    "../chunk_08.mp4","../chunk_09.mp4","../chunk_10.mp4"
  ];

  const vids = [document.getElementById("v0"), document.getElementById("v1")];
  const hint = document.getElementById("hint");
  let cur = 0, idx = 0;
  const next = i => (i + 1) % PLAYLIST.length;
  const prep = (el,p) => { el.src = PLAYLIST[p]; el.load(); };

  function begin(){
    prep(vids[cur], idx);
    prep(vids[1-cur], next(idx));
    vids[cur].classList.add("active");
    vids[cur].play().catch(()=>{});
    bind();
  }
  function bind(){ vids.forEach(v=>v.onended=null); vids[cur].onended = swap; }
  function swap(){
    const o = 1-cur, np = next(idx);
    vids[o].currentTime = 0;
    vids[o].classList.add("active");
    vids[o].play().catch(()=>{});
    vids[cur].classList.remove("active");
    vids[cur].pause();
    cur = o; idx = np;
    prep(vids[1-cur], next(idx));
    bind();
  }
  // Sempre mudo. Clique só coloca em tela cheia.
  function goFullscreen(){
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    hint.classList.add("gone");
  }
  document.addEventListener("click", goFullscreen);
  window.addEventListener("load", ()=>{ vids.forEach(v=>{v.muted=true;}); begin(); });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) vids[cur].play().catch(()=>{}); });
  setTimeout(()=>hint.classList.add("gone"), 6000);
</script>
</body>
</html>
